name: Release Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - Pipfile
      - Dockerfile

permissions: {}

jobs:
  release:
    name: Create tag release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        id: semantic_release
        with:
          dry_run: false
          branch: main
          tag_format: v${version}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
